services:
  processor:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    mem_limit: 2g
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - dev.env
    environment:
      INPUT_DIR: /data/fixture/linked
    volumes:
      # the whole fixture, so the port folder's links into the sibling upstream/ folder resolve
      - ./data/fixture:/data/fixture:ro
      - ./data/output:/data/output
